[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadastr-to-kml"
version = "0.2.0"
description = "Экспорт границ объектов НСПД и координат в KML/KMZ"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dmitry Le" }]
keywords = ["kml", "kmz", "nspd", "cadastre", "geojson", "gps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0,<3",
    "urllib3>=2.0.0,<3",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
cadastr-to-kml = "cadastr_to_kml:main"

[tool.setuptools]
py-modules = ["core", "web_app", "cadastr_to_kml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "web_app", "cadastr_to_kml"]
